;gap:12px}.card{display:grid;gap:11px;padding:16px;align-content:start}.card p{white-space:pre-wrap;overflow-wrap:anywhere}.fields{display:grid;gap:12px;max-width:720px}.fields label{display:grid;gap:6px;font-weight:600}input,textarea,select{max-width:100%;width:100%;background:white;border:1px solid var(--line);border-radius:4px;padding:9px 10px}textarea{min-height:100px;resize:vertical}dialog{width:min(460px,calc(100vw - 26px));max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:20px;color:var(--ink)}dialog::backdrop{background:#25374450}dialog form{display:grid;gap:13px}dialog .actions{justify-content:end}.mobile-nav{display:none}.toast{position:fixed;bottom:16px;right:16px;background:#263d4b;color:white;padding:9px 14px;border-radius:4px;z-index:20;font-size:14px}.toast:empty{display:none}

/* The canvas covers the workspace. Navigation and tools sit above it. */
.shell.canvas-mode{position:relative;height:100dvh;min-height:0;overflow:hidden;isolation:isolate}
.canvas-mode .layout,.canvas-mode main{display:contents}
.canvas-mode .surface{position:absolute;inset:0;height:auto;background-color:#f3f8fb}
.canvas-mode .top,.canvas-mode .nav,.canvas-mode .mobile-nav,.canvas-mode .canvas-info,.canvas-mode .canvas-tools,.canvas-mode .canvas-details,.canvas-mode .canvas-hint{position:absolute;z-index:2;background:white;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 5px #263d4b15}
.canvas-mode .top{top:12px;left:12px;right:12px;height:48px;padding:0 13px}
.canvas-mode .nav{top:120px;left:12px;width:174px;max-height:calc(100% - 192px);overflow:auto;padding:9px}
.canvas-mode .nav .mono{margin:3px 0 6px}

.node-popup[hidden]{display:none}

.analysis-badge>span{display:block;padding:5px}
.organize-popup{position:absolute;z-index:3;top:calc(100% + 4px);left:0;width:min(300px,100%);max-height:325px;overflow:auto;box-shadow:0 4px 12px #263d4b30}

  .analysis-badge{top:65px;right:8px}

}

.node-popup .panel .card{padding:8px;gap:5px}

@media(max-width:760px){.organize-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.node-popup .panel{gap:7px}.project-cards .card{padding:10px}.project-cards .card h2{font-size:16px}}
html[data-edition=phone] .organize-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-edition=phone] .project-cards .card{padding:10px}
html[data-edition=phone] .project-cards .card h2{font-size:16px}

.canvas-mode .node-popup,.organize-popup{display:flex;flex-direction:column;overflow:hidden}
.canvas-mode .node-popup[hidden]{display:none}
.canvas-mode .canvas-details.node-popup:not([hidden]),.organize-popup{
  width:min(var(--popup-width,275px),calc(100vw - 20px));
  height:var(--popup-height,auto);
}
.canvas-mode .canvas-details.node-popup:not([hidden]){
  width:min(var(--popup-width,275px),calc(100% - 20px));
  max-height:calc(100% - 180px);
}
.organize-popup{max-height:55dvh}
.group:nth-child(3n) .organize-popup{left:auto;right:0}
.popup-body{overflow:auto;min-height:0;flex:1;align-content:start;overscroll-behavior:contain}
.popup-footer{display:flex;justify-content:flex-end;flex:none}
.resize-grip{padding:0;width:34px;height:28px;cursor:nwse-resize;touch-action:none;user-select:none;color:var(--strong);font-size:19px;line-height:1}
@media(max-width:760px){.group:nth-child(3n) .organize-popup{right:auto;left:0}.group:nth-child(2n) .organize-popup{left:auto;right:0}}
@media(max-width:680px){.organize-grid .group .organize-popup{left:50%;right:auto;transform:translateX(-50%)}}
html[data-edition=phone] .organize-grid .group .organize-popup{left:50%;right:auto;transform:translateX(-50%)}

.canvas-mode .surface{cursor:crosshair;isolation:isolate}

.marquee{position:absolute;z-index:3;pointer-events:none;border:1px solid #427ba2;background:#82b9dc34}

.description-editor{gap:6px;max-width:none}

<body>
<div class="shell">
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">✳</span> Unstuck</div><span class="top-project" id="projectName"></span><a class="edition" id="edition"></a></header>
<div class="layout"><aside class="nav"><p class="mono">Workspace</p><nav aria-label="Sections" id="navigation"></nav></aside>
<div class="mobile-nav"><label class="mono" for="mobileNavigation">Workspace</label><select id="mobileNavigation"></select></div>
<main id="screen"></main></div>
</div>
<dialog id="dialog"></dialog>
<div class="toast" role="status" id="toast"></div>
<script>
const $ = selector => document.querySelector(selector);
const symbols = ['▤','⌘','▥','✓'];
const pages = [
  ['projects','Projects','Choose a project to open its writing workspace.'],
  ['map','Story Map','Follow the story from setup to payoff.'],
  ['organize','Organize','Compare story material by category.'],
  ['finalize','Finalize','Review the relationships and save a version of your story.']
];
const categories = ['Plot','Characters','Events','Locations','Conflicts'];
const incenseItems = [
  {id:'opening-flood',category:'Events',title:'The funeral in flood season',order:0,body:'Bà Sáu dies while the rice fields are underwater. Lộc returns from Saigon for the first time in ten years. A week after the funeral, the family hosts a new-rice offering for the hamlet.'},
  {id:'last-wishes',category:'Events',title:'Bà Sáu’s last wishes',order:2,body:'Before the Nguyễn clan elders, the family learns that Bà Sáu left the ancestral altar and hương hỏa land to her youngest daughter, Út Hạnh. The elders nod and light incense.'},
  {id:'shrimp-offer',category:'Events',title:'The shrimp company’s offer',order:4,body:'Lộc brings an offer from Mekong Shrimp Co. Thịnh refuses because the land funds their father’s yearly giỗ, with thirty tables and a hired band. Lộc carried their father’s coffin three years ago.'},
  {id:'wedding',category:'Events',title:'The wedding during mourning',order:6,body:'Two months after the funeral, Thịnh’s son marries at a large wedding with red decorations and karaoke until midnight. The neighbors eat and congratulate the family.'},
  {id:'tet',category:'Events',title:'The agreement at Tết',order:8,body:'The siblings sell half the land and keep the half with the family graves. Lộc returns to Saigon. Thịnh lights incense alone while the fields turn green for spring.'},
  {id:'rach-sen',category:'Locations',parent:'opening-flood',title:'Rạch Sen',body:'A fictional rice-farming hamlet in the late-1990s Mekong Delta. Young workers often leave for Saigon and return for Tết and death anniversaries.'},
  {id:'rice-fields',category:'Locations',parent:'opening-flood',title:'Rice fields and canals',body:'Families grow rice and fish the canals. The flood season puts the fields underwater from August to November.'},
  {id:'family-money',category:'Conflicts',parent:'shrimp-offer',title:'The Nguyễn family’s debts',body:'A bad harvest forced the family to mortgage part of its land. It sold its last buffalo the previous year.'},
  {id:'huong-hoa',category:'Conflicts',parent:'last-wishes',title:'Hương hỏa land',body:'In Rạch Sen, the eldest son normally keeps the altar and the land that funds ancestral rites. Daughters who marry join their spouse’s family.'},
  {id:'birth-order',category:'Conflicts',parent:'last-wishes',title:'Birth-order names',body:'In the story’s Southern naming custom, the eldest is called Hai, followed by Ba and Tư. The youngest is called Út.'},
  {id:'clan-elders',category:'Characters',parent:'last-wishes',title:'Nguyễn clan elders',body:'The clan head and elders settle disputes before the family altar. They want to keep the ancestral land within the family.'},
  {id:'ancestor-worship',category:'Conflicts',parent:'tet',title:'Ancestor worship',body:'Households keep altars for the dead and hold a giỗ for each parent every year.'},
  {id:'mourning',category:'Conflicts',parent:'wedding',title:'Mourning period',body:'Children may mourn a parent for up to three years. The hamlet expects no weddings, loud celebrations, or red at Tết during that time.'},
  {id:'seasons',category:'Locations',parent:'opening-flood',title:'Flood and harvest calendar',body:'The fields flood from August through November. Rice is harvested after the water recedes in December, and again in March.'},
  {id:'rice-offering',category:'Conflicts',parent:'opening-flood',title:'Cúng cơm mới',body:'Rạch Sen thanks its ancestors for the first harvest in the ninth lunar month, around October.'},
  {id:'thinh',category:'Characters',parent:'last-wishes',title:'Ba Thịnh',body:'The eldest son, 46, farms the ancestral land and tends the altar. He wants to preserve his father’s arrangements and needs to consider what his siblings want.'},
  {id:'loc',category:'Characters',parent:'shrimp-offer',title:'Tư Lộc',body:'The middle son, 40, works for the shrimp company in Saigon. He wants to clear the family’s debts by selling and wants his brother’s respect.'},
  {id:'ba-sau',category:'Characters',parent:'opening-flood',title:'Bà Sáu',body:'The siblings’ mother dies during the autumn flood season. She appears through memories and her last wishes.'},
  {id:'hanh',category:'Characters',parent:'last-wishes',title:'Út Hạnh',body:'The youngest daughter, 32, stayed home to care for her mother. She wants to keep the house and needs to make room for a life of her own.'},
  {id:'shrimp-company',category:'Characters',parent:'shrimp-offer',title:'Mekong Shrimp Co.',body:'The company wants to turn rice land along the canal into shrimp ponds.'},
  {id:'family-choice',category:'Conflicts',parent:'tet',title:'Keep the land or sell it?',body:'After their mother dies, three siblings must decide whether to keep the land that funds the family’s rituals or sell it to pay their debts.'}
];
const demoIssues = [
  {id:'loc-timeline',title:'Lộc’s return dates conflict',question:'When did Lộc last come home?',
    body:'The opening says Lộc hasn’t been home for ten years. In the offer scene, he carried his father’s coffin in Rạch Sen three years ago.',
    from:'opening-flood',to:'shrimp-offer',order:3,field:'locTimelineFix',beat:'Lộc’s last visit',
    options:[['Clarify the last visit','Say this is Lộc’s first visit since his father’s funeral three years ago.'],['Keep the ten-year absence','Give the coffin scene to someone who was in Rạch Sen three years ago.']]}
];
const issueFor = key => demoIssues.find(issue=>issue.id===key);
const openIssues = p => p.sampleKey==='incense-land' ? demoIssues.filter(issue=>!p[issue.field] &&
  p.items.some(item=>item.id===issue.from) && p.items.some(item=>item.id===issue.to)) : [];
function updateIssueFix(p,item,body) {
  const issue = issueFor(item?.fixesIssue);

        pan(next.x-pinch.x,next.y-pinch.y);
        zoom(next.distance/pinch.distance,next);
        pinch = next;
        return;
      }
    }
    if (drag?.pointer !== event.pointerId) return;
    if (!drag.moved && Math.hypot(point.x-drag.start.x,point.y-drag.start.y)<5) return;
    const previous = drag.moved ? drag.last : drag.start;
    const dx = point.x-previous.x, dy = point.y-previous.y;
    if (!drag.moved && drag.mode==='select') {
      selected = null;
      inspector();
    }
    drag.moved = true;
    drag.last = point;
    if (drag.mode==='select') {
      moveMarquee(drag.start,point);
    } else if (drag.mode==='rotate') {
      view.ay += dx*.012;
      view.ax += dy*.012;
      draw();
    } else if (drag.mode==='move') {
      const scale = view.z*canvasLayout(surface).factor;
      const moving = selection.has(drag.node.id) ? nodes.filter(node=>selection.has(node.id)) : [drag.node];
      const mx = compact() ? dy/(scale*.77) : dx/scale;
      const my = compact() ? dx/(scale*.86) : dy/scale;
      moving.forEach(node=>{
        node.x += mx;
        node.y += my;
        p.nodeOffsets ??= {};
        const offset = p.nodeOffsets[node.id] ?? {x:0,y:0};
        p.nodeOffsets[node.id] = {x:offset.x+mx,y:offset.y+my};
      });
      draw();
    } else if (drag.mode==='pan') {
      pan(dx,dy);
      draw();
    }
  });
  function finishPointer(event) {
    if (touches.delete(event.pointerId)) pinch = touches.size>=2 ? touchSpan() : null;
    if (drag?.pointer !== event.pointerId) return;
    marquee.hidden = true;
    const completed = event.type==='pointerup';
    if (drag.mode==='move' && drag.moved) save();
    if (completed && !drag.moved && event.button===0) selectNode(drag.node?.id ?? null);
    drag = null;
  }
  surface.addEventListener('pointerup',finishPointer);
  surface.addEventListener('pointercancel',finishPointer);
  surface.addEventListener('lostpointercapture',finishPointer);
  surface.addEventListener('click',event => {
    if (event.detail !== 0) return;
    const node = event.target.closest('[data-node]');
    if (node) selectNode(node.dataset.node);
  });
  surface.addEventListener('dblclick',event => {
    const node = event.target.closest('[data-node]');
    if (node) focusNode(node.dataset.node);
  });
  surface.addEventListener('wheel',event => {
    event.preventDefault();
    const unit = event.deltaMode===1 ? 16 : event.deltaMode===2 ? surface.clientHeight : 1;
    if (event.ctrlKey || event.metaKey) {
      if (!nativePinch) zoom(Math.exp(-event.deltaY*unit*.009),localPoint(event.clientX,event.clientY));
    } else {
      pan(-event.deltaX*unit,-event.deltaY*unit);
      draw();
    }
  },{passive:false});
  surface.addEventListener('gesturestart',event=>{
    event.preventDefault();
    nativePinch = 1;
  },{passive:false});
  surface.addEventListener('gesturechange',event=>{
    if (!nativePinch) return;
    event.preventDefault();
    zoom(event.scale/nativePinch,localPoint(event.clientX,event.clientY));
    nativePinch = event.scale;
  },{passive:false});
  surface.addEventListener('gestureend',event=>{
    event.preventDefault();
    nativePinch = null;
  },{passive:false});
  function selectNode(nodeId) {
    selection.clear();
    const hint = $('#canvasHint');
    hint.textContent = hint.dataset.default;
    selected = nodeId;
    popupMode = 'details';
    inspector();
    draw();
  }
  function focusNode(nodeId, onlyIfOutside = false) {
    const node = nodes.find(entry=>entry.id===nodeId);
    if (!node) return;
    const [x,y] = sizePoint(node.x,node.y);
    const layout = canvasLayout(surface), size = view.z*layout.factor;
    const px = layout.x+(view.x+x)*size, py = layout.y+(view.y+y)*size;
    if (!onlyIfOutside || px<layout.left+60 || px>surface.clientWidth-60 || py<125 || py>surface.clientHeight-75) {
      Object.assign(view,{x:-x,y:-y,z:1});
    }
    selectNode(nodeId);
  }
  graph = {draw,zoom,focusNode,clearSelection:()=>selectNode(null),reset() {
    Object.assign(view,{x:0,y:0,z:1,ax:.25,ay:-.35});
    draw();
  }};
  inspector();
  draw();
}
function nodeOptions(item) {
  const issue = issueFor(selected);
  if (issue) return issue.options;
  return [
    ['Show the cause','Add a moment before “'+item.title+'” that shows what causes it.'],
    ['Show the consequence','Add a follow-up to “'+item.title+'” that changes what a character can do next.']
  ];
}
function nodeDetails(item) {
  const isIssue = issueFor(selected);
  const title = isIssue ? isIssue.question : item.title;
  const body = isIssue ? project().issueDescriptions?.[isIssue.id] ?? isIssue.body : item.body;
  const header = '<span class="mono'+(isIssue ? ' issue-text' : '')+'">'+escape(isIssue ? 'Open plot hole' : item.category==='Unsorted' ? 'Idea' : item.category)+'</span><h2>'+escape(title)+'</h2>';
  const description = '<p class="muted node-description" tabindex="0" data-description title="Double-click to edit" aria-description="Double-click or press Enter to edit">'+escape(body || 'Add a description')+'</p>';
  const tabs = '<div class="actions">'+[['suggestions','Suggestions'],['experiment','Experiment']].map(([key,label])=>button(label,'mode:'+(key===popupMode ? 'details' : key),key===popupMode)).join('')+'</div>';
  let content;
  if (popupMode==='suggestions' || popupMode==='experiment') {
    const options = nodeOptions(item);
    const experimenting = popupMode==='experiment';
    content = '<p class="muted">'+(experimenting ? 'Try an alternate direction as a branch.' : 'Sample AI suggestions')+'</p>'+
      options.map(([label,description],index)=>card(label,description,button(experimenting ? 'Try branch' : 'Add node',(experimenting ? 'try-option:' : 'add-option:')+index,true))).join('')+
      (experimenting ? button('Write a branch','branch') : '');
  } else {
    content = '';
    if (!isIssue) content += '<div class="actions">'+button('Edit note','edit:'+item.id)+button('Connect notes','connect')+button('Remove','remove:'+item.id)+'</div>'+
      (item.reference?.startsWith('data:') ? '<a download="'+escape(item.file)+'" href="'+escape(item.reference)+'">'+escape(item.file)+'</a>' : escape(item.file))+
      (item.alternate ? button('Use this branch','use-branch:'+item.id,true) : '');
  }
  return header+description+tabs+content;
}
function inspector() {
  const popup = $('#canvasDetails'), panel = $('#inspector');
  if (!popup) return;
  const p = project(), item = p.items.find(note=>note.id===selected);
  const hasIssue = openIssues(p).some(issue=>issue.id===selected);
  popup.hidden = !item && !hasIssue && selected!=='opening';
  panel.innerHTML = popup.hidden ? '' : selected==='opening' ? '<h2>Opening</h2>'+button('+ Beat','add:Events',true) : nodeDetails(item);
  applyPopupSize();
}
function insertOption(title,body,alternate,placement = 1) {
  const p = project(), isIssue = issueFor(selected);
  const parent = isIssue ? isIssue.from : selected;
  const base = p.items.find(item=>item.id===parent);
  const entry = {id:id(),title,body,category:isIssue ? 'Events' : 'Plot',parent,alternate,fixesIssue:isIssue?.id,
    x:(base?.x ?? 0)+130,y:(base?.y ?? 0)+55};
  if (isIssue) entry.order = isIssue.order;
  else if (base) entry.order = beatOrder(base,p)+placement*.5;
  p.items.push(entry);
  if (!alternate && isIssue) {
    updateIssueFix(p,entry,body);
    canvasTool = 'pan';
  }
  if (base) p.links.push([base.id,entry.id]);
  selected = entry.id;
  popupMode = 'details';
  save();
  render();
  graph?.focusNode(entry.id,true);
  notify(alternate ? 'Alternate branch added.' : isIssue ? 'Beat added. Plot hole resolved.' : 'Node added.');
}
document.addEventListener('click',event => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const [action, arg] = target.dataset.action.split(':');
  const p = project();
  const item = p?.items.find(note=>note.id===arg);
  switch (action) {
    case 'go': go(arg); return;
    case 'cancel': $('#dialog').close(); return;
    case 'in': graph.zoom(1.25); return;
    case 'out': graph.zoom(.8); return;
    case 'reset': graph.reset(); return;
    case 'focus': graph.focusNode(arg); return;
    case 'note': editItem(); return;
    case 'add': editItem(null,arg); return;
    case 'edit': if (item) editItem(item); return;
    case 'remove':
      dialog('Remove this note?','<p>'+escape(item.title)+'</p>',() => {
        p.items = p.items.filter(note=>note.id!==arg);
        p.links = p.links.filter(link=>!link.includes(arg));
        updateIssueFix(p,item,p.items.find(note=>!note.alternate && issueFor(note.fixesIssue)===issueFor(item.fixesIssue))?.body || '');
        if (selected===arg) selected=null;
      },'Remove');
      return;
    case 'open': openProject(state.projects.find(entry=>entry.id===arg)); return;
    case 'new-project':
    case 'rename': {
      const entry = state.projects.find(project=>project.id===arg);
      dialog(entry ? 'Rename project' : 'New story project','<label>Project name<input required maxlength="80" name="name" value="'+escape(entry?.name)+'"></label>',data=>{
        const name = data.get('name').trim();
        if (!name) return false;
        if (entry) entry.name = name;
        else {
          const created = makeProject(name);
          state.projects.push(created);
          openProject(created);
        }
      },entry ? 'Save' : 'Create');
      return;
    }
    case 'toggle-nav': navHidden = !navHidden; render(); return;
    case 'tool': if (compact()) return; canvasTool = canvasTool === 'pan' ? 'rotate' : 'pan'; render(); return;
    case 'jump-issue': {
      const issues = openIssues(p);
      const index = issues.findIndex(issue=>issue.id===selected);
      graph.focusNode(issues[(index+1)%issues.length].id,true);
      return;
    }
    case 'replay-knot':
      demoIssues.forEach(issue=>{
        const stored = p[issue.field];
        const fixes = p.items.filter(note=>issueFor(note.fixesIssue)===issue);
        if (stored && !fixes.some(note=>note.body===stored)) {
          p.items.push({id:id(),title:issue.beat,body:stored,category:'Events',order:issue.order,
            parent:issue.from,fixesIssue:issue.id,alternate:true,x:5,y:-10});
        }
        fixes.forEach(note=>{note.alternate = true;});
        p[issue.field] = '';
      });
      Object.assign(timeline,{x:0,y:0,z:1,ax:.25,ay:-.35});
      selected = openIssues(p)[0]?.id;
      popupMode = 'details';
      break;
    case 'popup': selected = arg; popupMode = 'details'; break;
    case 'cancel-description': render(); return;
    case 'close-popup': selected = null; popupMode = 'details'; break;
    case 'mode': popupMode = arg; break;
    case 'add-option':
    case 'try-option': {
      const [title,body] = nodeOptions(p.items.find(note=>note.id===selected))[Number(arg)];
      insertOption(title,body,action==='try-option',Number(arg)===0 ? -1 : 1);
      return;
    }
    case 'branch':
      dialog('New alternate branch','<label>Title<input required name="title"></label><label>What changes?<textarea required name="body"></textarea></label>',data=>{
        const title = data.get('title').trim(), body = data.get('body').trim();
        if (!title || !body) return false;
        insertOption(title,body,true);
      });
      return;
    case 'use-branch':
      item.alternate = false;
      if (item.fixesIssue) {
        updateIssueFix(p,item,item.body);
        canvasTool = 'pan';
      }
      break;
    case 'categorize': {
      const patterns = [/plot|chapter|ending/i,/character|motive|person/i,/event|scene|happen/i,/location|city|place/i,/conflict|rival|fight/i];
      let count = 0;
      p.items.filter(note=>note.category==='Unsorted').forEach(note=>{
        const match = patterns.findIndex(pattern=>pattern.test(note.title+' '+note.body));
        if (match>=0) {note.category=categories[match]; count++;}
      });
      notify(count ? 'Categorized '+count+' note(s).' : 'No category matches found in unsorted notes.');
      break;
    }
    case 'connect': {
      if (p.items.length < 2) {notify('Add at least two notes to make a connection.'); return;}
      const options = p.items.map(note=>'<option value="'+escape(note.id)+'">'+escape(note.title)+'</option>');
      dialog('Connect story notes','<label>From<select name="from">'+options.join('')+'</select></label><label>To<select name="to">'+options.slice().reverse().join('')+'</select></label>',data=>{
        const from=data.get('from'),to=data.get('to');
        if (from===to) {notify('Choose two different notes.');return false;}
        if (!p.links.some(link=>link[0]===from && link[1]===to)) p.links.push([from,to]);
      },'Connect');
      return;
    }
    case 'final':
      p.final = {name:p.name,date:new Date().toLocaleString(),items:p.items.map(({title,category,body,file})=>({title,category,body,file})),plotHoleFixes:Object.fromEntries(demoIssues.filter(issue=>p[issue.field]).map(issue=>[issue.id,p[issue.field]])),links:p.links.map(link=>link.map(noteId=>p.items.find(note=>note.id===noteId)?.title))};
      notify('Version saved.'); break;
    case 'download': {
      const url = URL.createObjectURL(new Blob([JSON.stringify(p.final,null,2)],{type:'application/json'}));
      const link = document.createElement('a');
      link.href=url; link.download='story-version.json'; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      return;
    }
  }
  save();
  render();
});
document.addEventListener('pointerdown',event=>{
  const grip = event.target.closest('[data-resize-popup]');
  if (!grip || event.button !== 0 || popupResize) return;
  const popup = grip.closest('.node-popup, .organize-popup');
  popupResize = {popup,pointer:event.pointerId,x:event.clientX,y:event.clientY,
    width:popup.offsetWidth,height:popup.offsetHeight,left:popup.offsetLeft,top:popup.offsetTop};
  grip.setPointerCapture(event.pointerId);
  event.preventDefault();
});
document.addEventListener('pointermove',event=>{
  const drag = popupResize;
  if (drag?.pointer !== event.pointerId) return;
  resizePopup(drag.popup,drag.width+event.clientX-drag.x,drag.height+event.clientY-drag.y);
});
function endPopupResize(event) {
  if (popupResize?.pointer === event.pointerId) popupResize = null;
}
document.addEventListener('pointerup',endPopupResize);
document.addEventListener('pointercancel',endPopupResize);
document.addEventListener('lostpointercapture',endPopupResize);
document.addEventListener('keydown',event=>{
  const description = event.target.closest('[data-description]');
  if (description && (event.key==='Enter' || event.key===' ')) {
    event.preventDefault();
    editDescription(description);
    return;
  }
  if (event.key==='Escape' && event.target.closest('.description-editor')) {
    render();
    return;
  }
  if (event.key==='Escape' && graph && !$('#dialog').open) graph.clearSelection();
  const grip = event.target.closest('[data-resize-popup]');
  const delta = {ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]}[event.key];
  if (!grip || !delta) return;
  event.preventDefault();
  const popup = grip.closest('.node-popup, .organize-popup');
  resizePopup(popup,popup.offsetWidth+delta[0],popup.offsetHeight+delta[1]);
});
function fitDescriptionEditor(textarea = $('#descriptionEditor textarea')) {
  if (!textarea) return;
  textarea.style.height = 'auto';
  textarea.style.height = textarea.scrollHeight + textarea.offsetHeight - textarea.clientHeight + 'px';
}
function editDescription(element) {
  const p = project(), issue = issueFor(selected);
  const item = p.items.find(note=>note.id===selected);
  if (!issue && !item) return;
  const body = issue ? p.issueDescriptions?.[issue.id] ?? issue.body : item.body;
  const editor = document.createElement('form');
  editor.className = 'fields description-editor';
  editor.id = 'descriptionEditor';
  editor.innerHTML = '<textarea name="body" rows="1" aria-label="Description">'+escape(body)+'</textarea>'+
    '<div class="actions">'+button('Cancel','cancel-description')+'<button class="primary">Save</button></div>';
  element.replaceWith(editor);
  const textarea = editor.querySelector('textarea');
  fitDescriptionEditor(textarea);
  textarea.addEventListener('input',()=>{
    fitDescriptionEditor(textarea);
    graph?.draw();
  });
  textarea.focus({preventScroll:true});
  textarea.setSelectionRange(textarea.value.length,textarea.value.length);
  graph?.draw();
}
document.addEventListener('dblclick',event=>{
  const description = event.target.closest('[data-description]');
  if (description) editDescription(description);
});
let lastDescriptionTap;
document.addEventListener('pointerup',event=>{
  if (event.pointerType !== 'touch') return;
  const description = event.target.closest('[data-description]');
  if (description && lastDescriptionTap?.element===description && event.timeStamp-lastDescriptionTap.time<350 &&
      Math.hypot(event.clientX-lastDescriptionTap.x,event.clientY-lastDescriptionTap.y)<25) {
    lastDescriptionTap = null;
    editDescription(description);
  } else {
    lastDescriptionTap = description ? {element:description,time:event.timeStamp,x:event.clientX,y:event.clientY} : null;
  }
});
document.addEventListener('submit',event=>{
  if (event.target.id !== 'descriptionEditor') return;
  event.preventDefault();
  const body = new FormData(event.target).get('body').trim();
  const p = project(), issue = issueFor(selected);
  if (issue) {
    p.issueDescriptions ??= {};
    p.issueDescriptions[issue.id] = body;
  } else {
    const item = p.items.find(note=>note.id===selected);
    item.body = body;
    updateIssueFix(p,item,body);
  }
  save();
  render();
});
$('#mobileNavigation').addEventListener('change',event=>go(event.target.value));
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render();});
window.addEventListener('resize',()=>{fitDescriptionEditor();graph?.draw();});
render();
</script>
